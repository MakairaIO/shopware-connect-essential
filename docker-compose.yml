services:
  shopware:
    image: dockware/dev:6.5.8.16
    container_name: shopware65
    volumes:
      - "./:/var/www/html/custom/plugins/MakairaConnectEssential"
      - "/var/www/html/custom/plugins"
      - "db_volume65:/var/lib/mysql"
      - "shop_volume65:/var/www/html"
    ports:
      - "80:80"
      - "3306:3306"
      - "8888:8888"
      - "9999:9999"
      - "9998:9998"
    networks:
      - web
    environment:
      - XDEBUG_ENABLED=1

volumes:
  db_volume65:
    driver: local
  shop_volume65:
    driver: local

networks:
  web:
